name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches extension version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('apps/chrome/package.json', 'utf8'));
          assert.equal(process.env.RELEASE_TAG.replace(/^v/, ''), version);
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check extension
        run: |
          pnpm --filter chrome lint
          pnpm --filter chrome typecheck
          pnpm --filter chrome test

      - name: Package extensions
        run: |
          pnpm --filter chrome zip
          pnpm --filter chrome zip:firefox
          pnpm --filter chrome lint:firefox
          pnpm --filter chrome verify:packages

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" apps/chrome/.output/*.zip \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
