name: CI

on:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build apps
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

      - name: Build and validate Firefox extension
        run: |
          pnpm --filter chrome build:firefox
          pnpm --filter chrome lint:firefox

      - name: Package extensions and verify Firefox source rebuild
        run: |
          pnpm --filter chrome zip
          pnpm --filter chrome zip:firefox
          pnpm --filter chrome verify:packages
